<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Autonomous AI Developer</title>
    <meta name="description" content="Autonomous AI software development platform powered by the Google Gemini API." />
    <meta property="og:title" content="AURA Autonomous AI Developer" />
    <meta property="og:description" content="Autonomous AI software development platform powered by the Google Gemini API." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Resolve GitHub Pages root paths without trailing slash to prevent 404 on assets
      (function() {
        var loc = window.location;
        if (loc.hostname.endsWith('github.io') && !loc.pathname.endsWith('/') && !loc.pathname.includes('.')) {
          loc.replace(loc.pathname + '/' + loc.search + loc.hash);
        }
      })();
    </script>
    <style>
      body { margin: 0; background-color: #020617; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      #root-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; text-align: center; }
      .aura-glow { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, rgba(2,6,23,0) 70%); border: 1px solid #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 1.5rem auto; animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; } }
      .fallback-btn { display: inline-block; margin-top: 1.25rem; padding: 0.6rem 1.25rem; background-color: #06b6d4; color: #020617; font-weight: bold; border-radius: 0.5rem; text-decoration: none; font-size: 0.875rem; transition: background-color 0.2s; }
      .fallback-btn:hover { background-color: #22d3ee; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-fallback">
        <div class="aura-glow">⚡</div>
        <h2 style="font-size: 1.25rem; margin: 0 0 0.5rem 0; color: #38bdf8;">AURA Autonomous AI Developer</h2>
        <p style="color: #94a3b8; font-size: 0.875rem; max-width: 480px; margin: 0 auto;">Initializing multi-agent neural orchestrator & Astro runtime...</p>
        <noscript>
          <p style="color: #f87171; margin-top: 1rem;">JavaScript is required to run the dynamic dashboard.</p>
        </noscript>
        <a href="./frontpage.html" class="fallback-btn">Open Standalone HTML Portal</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
