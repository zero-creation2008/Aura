# Deploy AURA to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== Checking index.html does not reference source files ==="
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still references /src/main.tsx — Vite did not transform the entry."
            cat dist/index.html
            exit 1
          fi
          if ! grep -q 'assets/' dist/index.html && ! grep -q '\.js' dist/index.html; then
            echo "WARNING: dist/index.html may not contain hashed asset references."
            cat dist/index.html
          fi
          echo "Build verification passed."

      - name: Copy 404 Page for SPA Routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
